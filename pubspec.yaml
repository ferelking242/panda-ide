name: panda
description: "Panda IDE — A powerful mobile IDE for Android, built with Flutter."
publish_to: 'none'
version: 2.3.3+50

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  android_intent_plus: ^6.0.0
  bloc: ^9.2.1
  code_forge: 10.7.0
  cryptography: ^2.9.0
  dartssh2: ^2.22.1
  diff_match_patch: ^0.4.1
  equatable: ^2.1.0
  file_picker: ^11.0.2
  flutter_archive: ^6.3.1
  flutter:
    sdk: flutter
  provider: ^6.1.2
  uuid: ^4.5.1
  yaml: ^3.1.2
  flutter_bloc: ^9.1.1
  file_selector: ^1.1.0
  flutter_colorpicker: ^1.1.0
  flutter_file_downloader: ^2.1.1
  google_fonts: ^8.2.1
  flutter_inappwebview: ^6.1.5
  flutter_json: ^0.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_pdfview: ^1.4.4
  flutter_pty: ^0.4.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  flutter_web_auth_2: ^5.0.3
  font_awesome_flutter: ^11.0.0
  html: ^0.15.6
  http: ^1.2.2
  intl: ^0.20.2
  llama_flutter_android: { git: https://github.com/heckmon/Llama-Flutter.git }
  markdown: ^7.3.1
  markdown_widget: ^2.3.2+8
  meta: '>=1.15.0 <2.0.0'
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.0
  percent_indicator: ^4.2.5
  re_highlight: ^0.0.3
  shared_preferences: ^2.5.5
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.2
  multi_split_view: ^3.2.0
  vector_math: '>=2.1.4 <3.0.0'
  xterm: ^4.0.0
  figma_squircle: ^0.6.3
  thinking_orbs_flutter: ^1.0.0
  crypto: ^3.0.3
  flutter_local_notifications: ^18.0.1

  archive: any
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/material_icons/
    - assets/webview/
    - assets/runtimes/
    - assets/fonts/
    - assets/certificates/
    - assets/extension_host/
    - assets/extension_host/api/
    - assets/extension_host/api/webview.js
    - assets/extension_host/api/scm.js
    - assets/extension_host/api/tasks.js
    - assets/extension_host/api/debug.js
    - assets/gateway/
    - assets/scripts/
    - assets/local_models_catalog.json
  fonts:
    # ── Broken (Iconsax) icon fonts ─────────────────────────────────────
    - family: BrokenIcons
      fonts:
        - asset: assets/fonts/broken.ttf
    - family: BrokenFilledIcons
      fonts:
        - asset: assets/fonts/broken_filled.ttf
    # ── Monospace code fonts ─────────────────────────────────────────────
    - family: firaCode
      fonts:
        - asset: assets/fonts/FiraCode-Medium.ttf
    - family: cascadia
      fonts:
        - asset: assets/fonts/CascadiaCodePL-Regular.ttf
    - family: hack
      fonts:
        - asset: assets/fonts/Hack-Regular.ttf
    - family: dejaVuSansMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
    - family: inconsolata
      fonts:
        - asset: assets/fonts/Inconsolata-Regular.ttf
    - family: jetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
    - family: jetBrainsMonoNF
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFont-Regular.ttf
    - family: proggy
      fonts:
        - asset: assets/fonts/ProggyVector-Regular.ttf
    - family: sourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Medium.ttf
