name: Build Android arm64-v8a

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK arm64-v8a only
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/debug-info
        # NOTE: --split-per-abi retiré intentionnellement.
        # L'app utilise des dynamic feature modules (rust_feature, go_feature, etc.)
        # qui sont incompatibles avec --split-per-abi : AGP échoue sur
        # processReleaseResources avec versionCode=null.
        # --target-platform android-arm64 seul produit un APK arm64-only identique.

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/panda-ide-${VERSION}-arm64.apk
          echo "APK: panda-ide-${VERSION}-arm64.apk"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panda-ide-arm64-apk
          path: build/app/outputs/flutter-apk/panda-ide-*-arm64.apk
          retention-days: 30

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/panda-ide-*-arm64.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
