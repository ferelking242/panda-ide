name: Test Extension Host

on:
  push:
    branches: [main, dev]
    paths:
      - 'assets/extension_host/**'
      - 'test/extension_host/**'
  pull_request:
    paths:
      - 'assets/extension_host/**'
      - 'test/extension_host/**'

jobs:
  test:
    name: Jest — Extension Host API shim
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: test/extension_host/package.json

      - name: Install dependencies
        working-directory: test/extension_host
        run: npm ci

      - name: Run Jest tests
        working-directory: test/extension_host
        run: npm test -- --coverage --ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: test/extension_host/coverage/
