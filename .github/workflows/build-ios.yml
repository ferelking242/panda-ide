name: Build iOS (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate iOS host project
        run: flutter create . --platforms ios --org com.panda

      - name: Set iOS deployment target
        run: |
          set -euo pipefail
          if grep -qE "^platform :ios" ios/Podfile; then
            sed -i '' "s/^platform :ios.*/platform :ios, '14.0'/" ios/Podfile
          else
            printf "platform :ios, '14.0'\n" | cat - ios/Podfile > ios/Podfile.tmp
            mv ios/Podfile.tmp ios/Podfile
          fi
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g" \
            ios/Runner.xcodeproj/project.pbxproj
          grep -qE "^platform :ios, ['\"]14\\.0['\"]" ios/Podfile

      - name: Get dependencies
        run: flutter pub get

      - name: Install pods and patch Llama iOS bridge
        run: |
          set -euo pipefail
          (cd ios && pod install)
          patch_count=0
          while IFS= read -r plugin; do
            patch_count=$((patch_count + 1))
            perl -0pi -e '
              s/LlamaHostApiProtocol/LlamaHostApi/g;
              s/\.onLoadProgress\(progress\)\s*\{\}/.onLoadProgress(progress: progress) { _ in }/g;
              s/\.onError\(error\.localizedDescription\)\s*\{\}/.onError(error: error.localizedDescription) { _ in }/g;
              s/\.onToken\(token\)\s*\{\}/.onToken(token: token) { _ in }/g;
              s/\.onDone\s*\{\}/.onDone { _ in }/g;
              s/^(\s*)public func /$1func /mg;
            ' "$plugin"
            if ! grep -q 'func detectGpu' "$plugin"; then
              sed '$d' "$plugin" > "${plugin}.tmp"
              cat >> "${plugin}.tmp" <<'SWIFT'
    func detectGpu(completion: @escaping (Result<GpuInfo, Error>) -> Void) {
        completion(.success(GpuInfo(
            vulkanSupported: false,
            gpuName: "None",
            vulkanApiVersion: -1,
            deviceLocalMemoryBytes: -1,
            freeRamBytes: -1,
            recommendedGpuLayers: 0
        )))
    }
}
SWIFT
              mv "${plugin}.tmp" "$plugin"
            fi
            grep -q 'LlamaHostApi' "$plugin"
            ! grep -q 'LlamaHostApiProtocol' "$plugin"
            grep -q 'onLoadProgress(progress: progress)' "$plugin"
            grep -q 'onError(error: error.localizedDescription)' "$plugin"
            grep -q 'onToken(token: token)' "$plugin"
            grep -q 'func detectGpu' "$plugin"
          done < <(find -L "$HOME/.pub-cache" ios/.symlinks ios/Pods \
            -type f -name 'LlamaFlutterAndroidPlugin.swift' \
            -print 2>/dev/null | sort -u)
          test "$patch_count" -gt 0

          shader="$(find "$HOME/.pub-cache" ios/Pods \
            -name 'ggml-metal-ios.metal' \
            -print -quit)"
          test -n "$shader"
          common_header="$(cd "$(dirname "$shader")/.." && pwd)/ggml-common.h"
          test -f "$common_header"
          awk -v header="$common_header" '
            /#include "ggml-common.h"/ {
              while ((getline line < header) > 0) print line
              close(header)
              next
            }
            { print }
          ' "$shader" > "${shader}.tmp"
          mv "${shader}.tmp" "$shader"
          ! grep -q '#include "ggml-common.h"' "$shader"
          grep -q 'block_q1_0' "$shader"
          grep -q 'QK4_0' "$shader"

      - name: Build iOS
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload release-assets
          mkdir -p Payload release-assets
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload \
            release-assets/panda-ide-ios-unsigned.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: panda-ide-ios-unsigned
          path: release-assets/*.ipa
          retention-days: 30
