name: Build iOS (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate iOS host project
        run: flutter create . --platforms ios --org com.panda

      - name: Set iOS deployment target
        run: |
          set -euo pipefail
          if grep -qE "^platform :ios" ios/Podfile; then
            sed -i '' "s/^platform :ios.*/platform :ios, '14.0'/" ios/Podfile
          else
            printf "platform :ios, '14.0'\n" | cat - ios/Podfile > ios/Podfile.tmp
            mv ios/Podfile.tmp ios/Podfile
          fi
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g" \
            ios/Runner.xcodeproj/project.pbxproj
          grep -qE "^platform :ios, ['\"]14\\.0['\"]" ios/Podfile

      - name: Get dependencies
        run: flutter pub get

      - name: Patch llama Metal shader for Xcode
        run: |
          set -euo pipefail
          podspec="$(find "$HOME/.pub-cache" \
            -path '*/Llama-Flutter-*/ios/llama_flutter_android.podspec' \
            -print -quit)"
          test -n "$podspec"
          perl -0pi -e 's|        -e "/__embed_ggml-common.h__/d" \\\n|        -e "/__embed_ggml-common.h__/d" \\\n        -e \x27/#include "ggml-common.h"/d\x27 \\\n|' "$podspec"
          grep -q '/#include "ggml-common.h"/d' "$podspec"

      - name: Prepare and patch generated Metal shader
        run: |
          set -euo pipefail
          (cd ios && pod install)
          shader="$(find "$HOME/.pub-cache" ios/Pods \
            -name 'ggml-metal-ios.metal' \
            -print -quit)"
          test -n "$shader"
          sed -i '' '/#include "ggml-common.h"/d' "$shader"
          ! grep -q '#include "ggml-common.h"' "$shader"

      - name: Build iOS
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload release-assets
          mkdir -p Payload release-assets
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload \
            release-assets/panda-ide-ios-unsigned.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: panda-ide-ios-unsigned
          path: release-assets/*.ipa
          retention-days: 30
