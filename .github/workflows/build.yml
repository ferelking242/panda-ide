name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unavailable Git LFS placeholders
        # The repository's LFS budget is currently exhausted. With LFS
        # disabled, checkout leaves tiny pointer files in Android's native
        # asset directories; Gradle/llvm-strip must not treat those as .so
        # binaries. Real assets are left untouched.
        run: |
          set -euo pipefail
          removed=0
          while IFS= read -r -d '' file; do
            if [ "$(head -n 1 "$file")" = "version https://git-lfs.github.com/spec/v1" ]; then
              rm "$file"
              removed=$((removed + 1))
            fi
          done < <(find android/app/src -type f -print0)
          echo "Removed $removed unavailable Git LFS placeholder(s)."
          if [ "$removed" -gt 0 ]; then
            echo "PANDA_LFS_FALLBACK=true" >> "$GITHUB_ENV"
          else
            echo "PANDA_LFS_FALLBACK=false" >> "$GITHUB_ENV"
          fi

      - name: Keep empty dynamic features resource-buildable
        # Some on-demand features contain only LFS-managed payloads. Once
        # those unavailable placeholders are removed, AGP has no processed
        # resource output for the feature. Add a CI-only resource so the
        # feature remains a valid, empty-on-disk module.
        run: |
          set -euo pipefail
          [ "${PANDA_LFS_FALLBACK:-false}" = "true" ] || exit 0
          for module in android/app/src/*_feature; do
            [ -d "$module" ] || continue
            if ! find "$module/src/main" -type f ! -name AndroidManifest.xml -print -quit | grep -q .; then
              mkdir -p "$module/src/main/res/values"
              cat > "$module/src/main/res/values/ci_lfs_fallback.xml" <<'EOF'
          <resources>
              <string name="ci_lfs_fallback" translatable="false">Panda IDE optional feature</string>
          </resources>
          EOF
              echo "Added fallback resource to $(basename "$module")."
            fi
          done

      - name: Skip unavailable dynamic features
        # Dynamic feature payloads are all Git LFS-managed in this checkout.
        # Do not ask AGP to build modules whose native payloads are absent.
        run: |
          set -euo pipefail
          [ "${PANDA_LFS_FALLBACK:-false}" = "true" ] || exit 0
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          source = path.read_text()
          start = source.find("    dynamicFeatures.addAll(")
          if start == -1:
              raise SystemExit("dynamicFeatures block not found")
          end = source.find("\n    )\n", start)
          if end == -1:
              raise SystemExit("dynamicFeatures block end not found")
          path.write_text(source[:start] + source[end + len("\n    )\n"):])
          print("Disabled dynamic feature packaging for the LFS fallback build.")
          PY

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi

      - name: Prepare APK release artifacts
        run: |
          mkdir -p build/out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/out/panda-ide-arm64-release.apk 2>/dev/null || cp build/app/outputs/flutter-apk/app-release.apk build/out/panda-ide-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/out/panda-ide-universal-release.apk 2>/dev/null || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: panda-ide-apk
          path: build/out/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.3.3-build.${{ github.run_number }}"
          name: "Release v2.3.3 Build ${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}
            
            - Features: Inline agent command approval UI, Autopilot mode, Session permission whitelist
            - Auto-update sidebar progress tracker
          draft: false
          prerelease: false
          files: build/out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
