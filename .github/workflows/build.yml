name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unavailable Git LFS placeholders
        # The repository's LFS budget is currently exhausted. With LFS
        # disabled, checkout leaves tiny pointer files in Android's native
        # asset directories; Gradle/llvm-strip must not treat those as .so
        # binaries. Real assets are left untouched.
        run: |
          set -euo pipefail
          removed=0
          while IFS= read -r -d '' file; do
            if [ "$(head -n 1 "$file")" = "version https://git-lfs.github.com/spec/v1" ]; then
              rm "$file"
              removed=$((removed + 1))
            fi
          done < <(find android/app/src -type f -print0)
          echo "Removed $removed unavailable Git LFS placeholder(s)."

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi

      - name: Prepare APK release artifacts
        run: |
          mkdir -p build/out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/out/panda-ide-arm64-release.apk 2>/dev/null || cp build/app/outputs/flutter-apk/app-release.apk build/out/panda-ide-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/out/panda-ide-universal-release.apk 2>/dev/null || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: panda-ide-apk
          path: build/out/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.3.3-build.${{ github.run_number }}"
          name: "Release v2.3.3 Build ${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}
            
            - Features: Inline agent command approval UI, Autopilot mode, Session permission whitelist
            - Auto-update sidebar progress tracker
          draft: false
          prerelease: false
          files: build/out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
