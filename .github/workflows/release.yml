name: Build and publish Panda IDE release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panda-release
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-android:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          build_number="${GITHUB_RUN_NUMBER}"
          echo "version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${base_version}-build.${build_number}" >> "$GITHUB_OUTPUT"
          echo "Building ${base_version}+${build_number}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Setup release keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/panda-ide.keystore
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../app/panda-ide.keystore
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=APP_BUILD_NUMBER="$BUILD_NUMBER" \
            --obfuscate \
            --split-debug-info=build/debug-info
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/panda-ide-${APP_VERSION}-build.${BUILD_NUMBER}-arm64.apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: panda-ide-android-${{ steps.version.outputs.build_number }}
          path: release-assets/*.apk
          retention-days: 30

  build-ios:
    name: Build iOS unsigned app
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          build_number="${GITHUB_RUN_NUMBER}"
          echo "version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${base_version}-build.${build_number}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate iOS host project
        run: flutter create . --platforms ios --org com.panda

      - name: Set iOS deployment target
        run: |
          set -euo pipefail
          if grep -qE "^platform :ios" ios/Podfile; then
            sed -i '' "s/^platform :ios.*/platform :ios, '14.0'/" ios/Podfile
          else
            printf "platform :ios, '14.0'\n" | cat - ios/Podfile > ios/Podfile.tmp
            mv ios/Podfile.tmp ios/Podfile
          fi
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g" \
            ios/Runner.xcodeproj/project.pbxproj
          grep -qE "^platform :ios, ['\"]14\\.0['\"]" ios/Podfile

      - name: Get dependencies
        run: flutter pub get

      - name: Patch llama Metal shader for Xcode
        run: |
          set -euo pipefail
          podspec="$(find "$HOME/.pub-cache" \
            -path '*/Llama-Flutter-*/ios/llama_flutter_android.podspec' \
            -print -quit)"
          test -n "$podspec"
          perl -0pi -e 's|        -e "/__embed_ggml-common.h__/d" \\\n|        -e "/__embed_ggml-common.h__/d" \\\n        -e \x27/#include "ggml-common.h"/d\x27 \\\n|' "$podspec"
          grep -q '/#include "ggml-common.h"/d' "$podspec"

      - name: Prepare and patch generated Metal shader
        run: |
          set -euo pipefail
          (cd ios && pod install)
          shader="$(find ios/Pods \
            -path '*/ggml-metal-ios.metal' \
            -print -quit)"
          test -n "$shader"
          sed -i '' '/#include "ggml-common.h"/d' "$shader"
          ! grep -q '#include "ggml-common.h"' "$shader"

      - name: Build iOS app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --no-pub \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=APP_BUILD_NUMBER="$BUILD_NUMBER"
          mkdir -p release-assets
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload \
            "release-assets/panda-ide-${APP_VERSION}-build.${BUILD_NUMBER}-ios-unsigned.ipa"

      - name: Upload iOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: panda-ide-ios-${{ steps.version.outputs.build_number }}
          path: release-assets/*.ipa
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android asset
        uses: actions/download-artifact@v4
        with:
          name: panda-ide-android-${{ needs.build-android.outputs.build_number }}
          path: release-assets

      - name: Download iOS asset
        uses: actions/download-artifact@v4
        with:
          name: panda-ide-ios-${{ needs.build-ios.outputs.build_number }}
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Panda IDE ${{ needs.build-android.outputs.version }} build ${{ needs.build-android.outputs.build_number }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify build result
    if: always()
    needs: [build-android, build-ios, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Send ntfy notification
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
          RELEASE_RESULT: ${{ needs.publish.result }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "NTFY_TOPIC is not configured; skipping notification."
            exit 0
          fi
          if [ "$ANDROID_RESULT" = success ] && [ "$IOS_RESULT" = success ] && [ "$RELEASE_RESULT" = success ]; then
            title="Panda IDE build réussi"
            priority="default"
            tags="white_check_mark,rocket"
            message="Android + iOS publiés. Commit ${SHA:0:7}"
          else
            title="Panda IDE build échoué"
            priority="urgent"
            tags="warning,rotating_light"
            message="Android=${ANDROID_RESULT}, iOS=${IOS_RESULT}, release=${RELEASE_RESULT}. Commit ${SHA:0:7}"
          fi
          curl --fail-with-body --retry 3 \
            -H "Title: $title" \
            -H "Priority: $priority" \
            -H "Tags: $tags" \
            -d "$message" \
            "https://ntfy.sh/${NTFY_TOPIC}"