name: Build and publish Panda IDE release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panda-release-${{ github.run_id }}
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-android:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          build_number="${GITHUB_RUN_NUMBER}"
          echo "version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${base_version}-build.${build_number}" >> "$GITHUB_OUTPUT"
          echo "Building ${base_version}+${build_number}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Setup release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/panda-ide.keystore
          test -s android/app/panda-ide.keystore
          keytool -list -keystore android/app/panda-ide.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../app/panda-ide.keystore
          EOF
          echo "Release keystore validated."

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=APP_BUILD_NUMBER="$BUILD_NUMBER" \
            --obfuscate \
            --split-debug-info=build/debug-info
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/panda-ide-${APP_VERSION}-build.${BUILD_NUMBER}-arm64.apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: panda-ide-android-${{ steps.version.outputs.build_number }}
          path: release-assets/*.apk
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android asset
        uses: actions/download-artifact@v4
        with:
          name: panda-ide-android-${{ needs.build-android.outputs.build_number }}
          path: release-assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Panda IDE ${{ needs.build-android.outputs.version }} build ${{ needs.build-android.outputs.build_number }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
